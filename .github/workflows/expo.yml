name: Expo CI/CD

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  build:
    name: Expo Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - run: npm install -g eas-cli
    - run: npm install

    - run: eas whoami || echo $EXPO_TOKEN | eas login --token
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    - run: eas build --platform android --non-interactive

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test

    - name: Install Expo CLI
      run: npm install -g expo-cli

    - name: Login to Expo
      run: expo login --token ${{ secrets.EXPO_TOKEN }}

    - name: Publish to Expo
      run: expo publish
    - run: eas build --platform android --non-interactive


